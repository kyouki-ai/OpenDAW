name: Windows build
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    strategy:
      max-parallel: 1
      matrix:
        configuration: [Debug, Release]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      _CL_: /MP1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/windows --config ${{ matrix.configuration }} --parallel 1
      - name: Test
        run: ctest --test-dir build/windows -C ${{ matrix.configuration }} --output-on-failure --parallel 1
      - name: Screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.configuration }}
          path: |
            build/windows/screenshots/
            build/windows/Testing/Temporary/LastTest.log
